<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="مِراس">
  <!-- علامة مِراس — ميم واحدة، لون واحد.
       الحلقة = رأس الميم، والذيل يهبط ويكنس يساراً (اتجاه الكتابة العربية)
       وينتهي بقصّة مائلة تحاكي سنّ القلم. بلا إطارات متداخلة، بلا نقطة إشعار.
       الجوف (r=42) واسع عمداً كي ينجو عند ١٦ بكسل. -->
  <g fill="currentColor" stroke="currentColor">
    <path fill-rule="evenodd" d="M386 178A86 86 0 1 0 214 178A86 86 0 1 0 386 178ZM342 178A42 42 0 1 1 258 178A42 42 0 1 1 342 178Z"/>
    <path d="M250 219 C 268 308, 244 374, 150 404" stroke-width="44" stroke-linecap="butt" fill="none"/>
  </g>
</svg>
