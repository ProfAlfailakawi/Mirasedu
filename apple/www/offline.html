<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>مِراس</title>
<style>
  :root { --bg: #FFFFFF; --fg: #1c1c1e; --muted: #6e6e73; --accent: #1F6F5C; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111214; --fg: #f2f2f7; --muted: #aeaeb2; } }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font: -apple-system-body; font-family: -apple-system, "SF Arabic", system-ui, sans-serif;
    display: grid; place-items: center; text-align: center;
    padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
  }
  main { max-width: 26rem; }
  h1 { font: -apple-system-title2; font-weight: 700; margin: 0 0 .5rem; }
  p { color: var(--muted); line-height: 1.6; margin: 0 0 1.5rem; }
  .en { direction: ltr; font-size: .9em; }
  button {
    font: -apple-system-headline; border: 0; border-radius: 14px; padding: 14px 28px; min-height: 48px;
    background: var(--accent); color: #fff; cursor: pointer;
  }
  button:active { opacity: .7; }
  @media (prefers-reduced-motion: no-preference) { button { transition: opacity .15s; } }
  /* ركن الودجت (iPhone Duo): المحتوى يبدأ تحت الزاوية العليا اليمنى. نفس شروط قسم ١٣ في src/design/miras-duo-layouts.css. */
  @media screen and (orientation: portrait) and (min-width: 360px) and (max-width: 720px) and (min-height: 360px) and (min-aspect-ratio: 47/100),
    screen and (orientation: landscape) and (min-width: 540px) and (max-width: 1000px) and (min-height: 300px) and (max-height: 960px) and (max-aspect-ratio: 5/3),
    screen and (horizontal-viewport-segments: 2) {
    body { padding-top: calc(clamp(64px, 31vh, 270px) + 8px); }
  }
</style>
</head>
<body>
<main>
  <h1>مِراس</h1>
  <p>تعذّر الوصول إلى الخدمة الآن. تحقّق من اتصالك بالإنترنت ثم أعد المحاولة.<br>
     <span class="en">Can't reach Miras right now. Check your connection and try again.</span></p>
  <button id="retry" type="button">إعادة المحاولة · Retry</button>
</main>
<script>
  const target = "https://mirasedu.web.app";
  const go = () => { location.href = target; };
  document.getElementById("retry").addEventListener("click", go);
  window.addEventListener("online", go);
</script>
</body>
</html>
