<!doctype html>
<!--
  صفحة «حصة تحديث» (البرنامج يُحدَّث).

  الفكرة: بطاقة جدول حصص؛ الحصة الجارية اسمها «تحديث» وحولها حلقة عدٍّ تنازلي
  تمتلئ كجرس يقترب، والحصة التالية هي صفحة الزائر نفسها.

  أثناء نشر خدمة miras-api على Cloud Run يتبدّل الخادم، فتجيب واجهةُ Google
  الأماميّة بصفحة خطأٍ إنجليزية (500/502/503/504) لا يكتبها خادمُنا أصلاً.
  عاملُ الخدمة (public/sw.js) يحفظ هذه الصفحة عند تثبيته، ويقدّمها بدلاً من أيّ
  جوابٍ كهذا لتنقّلٍ، أو حين ينقطع التنقّل والجهازُ متّصل — والرابطُ في شريط
  العنوان يبقى ما طلبه الزائر، فإعادةُ التحميل تفتحه هو نفسه.

  مستقلّةٌ تماماً: لا طلبَ خارجياً، والخطُّ «تجوال» إن كان مثبّتاً على الجهاز وإلا
  خطُّ النظام. تسأل /api/health كل ثلاث ثوانٍ (وتتباطأ تدريجياً)، فإذا أجاب أعادت
  فتح الصفحة المطلوبة. وإن عادت الصفحةُ تتعثّر والخادمُ سليم ثلاثَ مرّاتٍ في
  دقيقتين، تباطأت إلى مرّةٍ كل نصف دقيقة ولا تدور في حلقة.
-->
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F5F7FB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A0A12" media="(prefers-color-scheme: dark)">
<title>حصة تحديث · مِراس</title>
<style>
/* رموز مِراس نفسها (index.css: --miras-*) منسوخةً هنا لأن الصفحة مستقلّة. */
:root{
  --brand:#4338CA;--brand-strong:#312E81;--brand-tint:#EEF0FE;--brand-line:#DCDCFB;--brand-on:#FFFFFF;
  --surface:#FFFFFF;--surface-2:#F5F7FB;--surface-3:#EDF1F8;--line:#E6EAF2;--line-soft:#EFF2F7;
  --ink:#0B1020;--ink-2:#46506A;--ink-3:#6B7690;--ok:#14956b;
  --grid:rgb(67 56 202 / .06);
  --e3:0 4px 10px rgba(11,16,32,.05),0 18px 44px rgba(11,16,32,.09);
  --e2:0 2px 4px rgba(11,16,32,.04),0 8px 20px rgba(11,16,32,.06);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --brand:#8B80FF;--brand-strong:#B4ACFF;--brand-tint:#221E4D;--brand-line:#322C6B;--brand-on:#0B0A1F;
    --surface:#12121C;--surface-2:#0A0A12;--surface-3:#1B1B29;--line:#262636;--line-soft:#1F1F2E;
    --ink:#F2F4FA;--ink-2:#AFB6C9;--ink-3:#848DA4;--ok:#46c79c;
    --grid:rgb(139 128 255 / .07);
    --e3:0 4px 10px rgba(0,0,0,.46),0 18px 44px rgba(0,0,0,.46);
    --e2:0 2px 4px rgba(0,0,0,.44),0 8px 20px rgba(0,0,0,.40);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:max(20px,env(safe-area-inset-top)) 16px max(20px,env(safe-area-inset-bottom));
  /* ورقة دفترٍ مربّعة خفيفة خلف البطاقة */
  background-color:var(--surface-2);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;background-position:center;
  color:var(--ink);
  font-family:"Tajawal","IBM Plex Sans Arabic","Noto Sans Arabic",-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif;
  font-synthesis:none;-webkit-font-smoothing:antialiased;text-align:start;
}
.card{
  width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);
  border-radius:26px;box-shadow:var(--e3);overflow:hidden;
}
.top{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px dashed var(--line)}
.top .mark{width:36px;height:36px;flex:none;display:block;border-radius:11px}
.top div{line-height:1.3}
.top b{font-size:15px;font-weight:800}
.top small{display:block;font-size:12px;font-weight:500;color:var(--ink-3)}
.bell{
  margin-inline-start:auto;display:inline-flex;align-items:center;gap:6px;
  height:30px;padding:0 11px;border-radius:999px;background:var(--brand-tint);color:var(--brand);
  font-size:12px;font-weight:700;white-space:nowrap;
}
.bell svg{width:15px;height:15px;transform-origin:50% 10%;animation:ring 4s ease-in-out infinite}
.intro{padding:20px 18px 6px}
h1{margin:0;font-size:24px;font-weight:800;line-height:1.45;letter-spacing:0}
.lead{margin:4px 0 0;font-size:15.5px;line-height:1.75;color:var(--ink-2)}
ol{list-style:none;margin:14px 0 0;padding:0 12px;display:grid;gap:8px}
li{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px}
.slot{flex:none;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:15px;font-weight:800}
.what{flex:1;min-width:0}
.what b{display:block;font-size:15px;font-weight:700;line-height:1.4}
.what span{display:block;font-size:12.5px;line-height:1.5;color:var(--ink-3)}
.tag{flex:none;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}
.done{opacity:.72}
.done .slot{background:var(--surface-3);color:var(--ink-3)}
.done .what b{color:var(--ink-2)}
.done .tag{color:var(--ok);display:inline-flex;align-items:center;gap:4px}
.done .tag svg{width:14px;height:14px}
.now{background:var(--brand-tint);border:1px solid var(--brand-line);padding:12px;box-shadow:var(--e2)}
.now .what b{font-size:20px;font-weight:800;color:var(--brand-strong)}
.now .what span{color:var(--ink-2)}
.now .tag{background:var(--brand);color:var(--brand-on)}
.clock{flex:none;position:relative;width:56px;height:56px}
.clock svg{width:100%;height:100%;display:block;transform:rotate(-90deg)}
.clock circle{fill:none;stroke-width:5;stroke-linecap:round}
.clock .track{stroke:var(--brand-line)}
.clock .fill{stroke:var(--brand);stroke-dasharray:138.2;stroke-dashoffset:138.2;animation:count 8s linear infinite}
.clock i{position:absolute;inset:0;display:grid;place-items:center;font-style:normal;font-size:17px;font-weight:800;color:var(--brand)}
.next .slot{border:1.5px dashed var(--brand-line);color:var(--brand)}
.next .tag{color:var(--ink-3);border:1px solid var(--line)}
.foot{margin-top:16px;padding:16px 18px 18px;background:var(--surface-2);border-top:1px solid var(--line-soft);display:grid;gap:10px}
.note{margin:0;min-height:22px;font-size:13.5px;line-height:1.7;color:var(--ink-2)}
button{
  min-height:48px;width:100%;padding:0 20px;border-radius:14px;cursor:pointer;
  border:0;background:var(--brand);color:var(--brand-on);
  font:inherit;font-size:15px;font-weight:800;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  box-shadow:0 8px 18px rgb(67 56 202 / .22);
  transition:filter .2s ease,transform .2s ease;
}
button svg{width:18px;height:18px}
button:hover{filter:brightness(1.07)}
button:active{transform:scale(.98)}
button:focus-visible{outline:2px solid var(--brand);outline-offset:3px}
@keyframes count{0%{stroke-dashoffset:138.2}90%,100%{stroke-dashoffset:0}}
@keyframes ring{0%,80%,100%{transform:rotate(0)}84%{transform:rotate(14deg)}88%{transform:rotate(-12deg)}92%{transform:rotate(8deg)}96%{transform:rotate(-4deg)}}
@media (prefers-reduced-motion:reduce){
  .clock .fill,.bell svg{animation:none}
  .clock .fill{stroke-dashoffset:42}
  button{transition:none}
}
</style>
</head>
<body>
<main class="card">
  <header class="top">
    <!-- أيقونة البرنامج نفسها: علامة الميم من brand/miras-mark.svg على مربّع النيلي. -->
    <svg class="mark" viewBox="0 0 512 512" focusable="false" aria-hidden="true">
      <defs><linearGradient id="tile" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5148D6"/><stop offset="1" stop-color="#3730A3"/></linearGradient></defs>
      <rect width="512" height="512" rx="115" fill="url(#tile)"/>
      <g transform="translate(256 256) scale(.95) translate(-268 -248)"><g fill="#FFFFFF" stroke="#FFFFFF">
        <path fill-rule="evenodd" stroke="none" d="M386 178A86 86 0 1 0 214 178A86 86 0 1 0 386 178ZM342 178A42 42 0 1 1 258 178A42 42 0 1 1 342 178Z"/>
        <path d="M250 219 C 268 308, 244 374, 150 404" stroke-width="44" stroke-linecap="butt" fill="none"/>
      </g></g>
    </svg>
    <div><b>مِراس</b><small>جدول اليوم</small></div>
    <span class="bell" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M10.268 21a2 2 0 0 0 3.464 0"/><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"/></svg>
      الجرس قريب
    </span>
  </header>

  <section class="intro">
    <h1 id="title">مِراس في حصة تحديث</h1>
    <p class="lead" id="lead">نُجهّز الصف، ويُستأنف الدرس بعد قليل.</p>
  </section>

  <ol aria-label="جدول الحصص">
    <li class="done">
      <span class="slot" aria-hidden="true">١</span>
      <span class="what"><b>الحصة السابقة</b><span>ما أنجزته محفوظ</span></span>
      <span class="tag"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>انتهت</span>
    </li>
    <li class="now" aria-current="step">
      <span class="clock" aria-hidden="true">
        <svg viewBox="0 0 56 56" focusable="false"><circle class="track" cx="28" cy="28" r="22"/><circle class="fill" cx="28" cy="28" r="22"/></svg>
        <i>٢</i>
      </span>
      <span class="what"><b>تحديث</b><span>نرتّب الصف لك الآن</span></span>
      <span class="tag">الآن</span>
    </li>
    <li class="next">
      <span class="slot" aria-hidden="true">٣</span>
      <span class="what"><b>صفحتك</b><span>تُفتح تلقائياً بعد الجرس</span></span>
      <span class="tag">التالية</span>
    </li>
  </ol>

  <footer class="foot">
    <p class="note" id="note" role="status" aria-live="polite">ابقَ في مقعدك: صفحتك تُفتح وحدها حين يُقرع الجرس.</p>
    <button type="button" id="retry">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
      جرّب الدخول الآن
    </button>
  </footer>
</main>
<script>
(function () {
  var HEALTH = "/api/health";
  var FIRST = 3000, CEILING = 15000, PATIENT = 30000;
  var KEY = "miras-updating-reloads";
  var tries = 0, timer = 0, asking = false;
  var title = document.getElementById("title");
  var lead = document.getElementById("lead");
  var note = document.getElementById("note");

  /* إعاداتُ التحميل في الدقيقتين الأخيرتين: ثلاثٌ والخادمُ سليم تعني أن الصفحة
     نفسها تتعثّر، فلا ندور في حلقة. */
  function recent() {
    try {
      var now = Date.now();
      return JSON.parse(sessionStorage.getItem(KEY) || "[]").filter(function (t) { return now - t < 120000; });
    } catch (e) { return []; }
  }
  function remember() {
    try { var list = recent(); list.push(Date.now()); sessionStorage.setItem(KEY, JSON.stringify(list)); } catch (e) {}
  }
  function stuck() { return recent().length >= 3; }

  /* فُتحت هذه الصفحة باسمها مباشرة: العودة إلى البداية، لا إليها. */
  function reopen() {
    remember();
    if (location.pathname === "/updating.html") location.replace("/");
    else location.reload();
  }

  function describe() {
    if (navigator.onLine === false) {
      title.textContent = "انقطع الاتصال بالإنترنت";
      lead.textContent = "نُكمل الدرس حين يعود الاتصال، دون أن تفعل شيئاً.";
      note.textContent = "";
    } else if (stuck()) {
      title.textContent = "مِراس في حصة تحديث";
      lead.textContent = "طالت الحصة اليوم أكثر من المعتاد، فشكراً على صبرك.";
      note.textContent = "نتفقّد الصف مرّةً كل نصف دقيقة، ولك أن تجرّب الدخول الآن.";
    } else {
      title.textContent = "مِراس في حصة تحديث";
      lead.textContent = "نُجهّز الصف، ويُستأنف الدرس بعد قليل.";
      note.textContent = "ابقَ في مقعدك: صفحتك تُفتح وحدها حين يُقرع الجرس.";
    }
  }

  function wait() {
    if (stuck()) return PATIENT;
    return Math.min(CEILING, Math.round(FIRST * Math.pow(1.3, Math.max(0, tries - 5))));
  }
  function later() { clearTimeout(timer); timer = setTimeout(ask, wait()); }

  function ask() {
    clearTimeout(timer);
    if (asking) return;
    if (navigator.onLine === false) { describe(); later(); return; }
    asking = true;
    tries++;
    var control = typeof AbortController === "function" ? new AbortController() : null;
    var guard = setTimeout(function () { if (control) control.abort(); }, 8000);
    fetch(HEALTH, { cache: "no-store", credentials: "same-origin", signal: control ? control.signal : undefined })
      .then(function (response) { return response.ok; }, function () { return false; })
      .then(function (ok) {
        clearTimeout(guard);
        asking = false;
        if (ok) { reopen(); return; }
        describe();
        later();
      });
  }

  document.getElementById("retry").addEventListener("click", function () {
    if (location.pathname === "/updating.html") location.replace("/");
    else location.reload();
  });
  window.addEventListener("online", function () { describe(); ask(); });
  window.addEventListener("offline", describe);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) ask(); });

  describe();
  later();
})();
</script>
</body>
</html>
